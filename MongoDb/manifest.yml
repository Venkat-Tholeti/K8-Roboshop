apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop #Namespace should be mentioned here so that it will create in that namespace
  #DEPLOYMENT LABELS
  labels:
    project: roboshop
    tier: database
    component: mongodb
spec:
  replicas: 1
  #THESE ARE THE LABELS REPLICASET USES TO CREATE POD REPLICAS, THIS SHOULD MATCH POD TEMPLATE LABELS
  selector:
   matchLabels:
    project: roboshop
    tier: database
    component: mongodb
#THIS IS POD DEFINITION
  template:
    metadata:
     labels:
      project: roboshop
      tier: database
      component: mongodb
    spec:
      containers:
        - name: mongodb
          image: venkattholeti/mongodb:v1

    #kubectl get pods -n roboshop (to see pods created under roboshop namespace)

---

apiVersion: v1
kind: Service
metadata:
   name: mongodb
   namespace: roboshop
   labels:
     project: roboshop
     tier: database
     component: mongodb
spec:
   selector:
     project: roboshop
     tier: database
     component: mongodb
   ports:
    - protocol: TCP
      port: 27017 #Service Port
      targetPort: 27017 #container port

